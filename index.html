<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOWER-01</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      canvas { display: block; }
      /* Matches the control the shipped artifact carries, so the dev page and
         the build behave the same way. */
      #full {
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 10;
        font: 12px/1 "Share Tech Mono", ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5fc8f0;
        background: rgba(6, 10, 15, 0.7);
        border: 1px solid #1b2b39;
        border-radius: 3px;
        padding: 5px 9px;
        cursor: pointer;
      }
      #full:hover { border-color: #5fc8f0; }
    </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BQcctXJz.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <button id="full" type="button" hidden>Full screen</button>
    <script>
      (function () {
        var btn = document.getElementById('full')
        var el = document.documentElement
        if (!el.requestFullscreen) return
        btn.hidden = false
        btn.addEventListener('click', function () {
          if (document.fullscreenElement) document.exitFullscreen()
          else el.requestFullscreen()
        })
        document.addEventListener('fullscreenchange', function () {
          btn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'
          setTimeout(function () { window.dispatchEvent(new Event('resize')) }, 60)
        })
      })()
    </script>
  </body>
</html>
