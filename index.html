<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOWER-01</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
      #game { width: 100vw; height: calc(100vh - 18px); }
      /*
       * The build stamp, which the Pages page lost when it stopped being the
       * single-file artifact.
       *
       * The artifact shell carries a strip naming the version; vite's own entry
       * page never did, so switching Pages to the multi-file build quietly took
       * it away. Nick: "I don't see the build details on the screen anymore to
       * validate I'm playing the right one." That matters more than cosmetics
       * right now - a tape records the build it was played on, and a tester who
       * cannot see theirs cannot tell me whether they reloaded.
       *
       * Eighteen pixels at the bottom, dim, out of the way of the board.
       */
      #build {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 18px;
        line-height: 18px;
        text-align: center;
        font: 11px "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        color: #3d5568;
        background: #0b0f14;
        user-select: text;
        pointer-events: auto;
      }
      canvas { display: block; }
      /* Matches the control the shipped artifact carries, so the dev page and
         the build behave the same way. */
      #full {
        position: fixed;
        top: 8px;
        right: 10px;
        z-index: 10;
        font: 12px/1 "Share Tech Mono", ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5fc8f0;
        background: rgba(6, 10, 15, 0.7);
        border: 1px solid #1b2b39;
        border-radius: 3px;
        padding: 5px 9px;
        cursor: pointer;
      }
      #full:hover { border-color: #5fc8f0; }
    </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BIl5SKFh.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="build">TOWER-01</div>
    <button id="full" type="button" hidden>Full screen</button>
    <script>
      (function () {
        var btn = document.getElementById('full')
        var el = document.documentElement
        if (!el.requestFullscreen) return
        btn.hidden = false
        btn.addEventListener('click', function () {
          if (document.fullscreenElement) document.exitFullscreen()
          else el.requestFullscreen()
        })
        document.addEventListener('fullscreenchange', function () {
          btn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'
          setTimeout(function () { window.dispatchEvent(new Event('resize')) }, 60)
        })
      })()
    </script>
  </body>
</html>
